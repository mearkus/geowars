name: Supabase Health Check

# Pings the Supabase REST API with a tiny read-only query so the free-tier
# project registers activity and is not auto-paused after 7 idle days.

on:
  schedule:
    - cron: '0 9 * * 1,4'   # Mondays and Thursdays at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-health-check
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      # Publicly readable table (the leaderboard); override with a repo variable if needed
      HEALTH_TABLE: ${{ vars.SUPABASE_HEALTH_TABLE || 'scores' }}
    steps:
      - name: Check required secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY repository secrets must be set."
            exit 1
          fi

      - name: Ping Supabase
        run: |
          set -euo pipefail
          url="${SUPABASE_URL%/}/rest/v1/${HEALTH_TABLE}?select=*&limit=1"

          status=$(curl --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 30 \
            --output response.json --write-out '%{http_code}' \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --header "Accept: application/json" \
            "$url")

          echo "HTTP status: $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Supabase health check failed (HTTP $status)"
            cat response.json || true
            exit 1
          fi
          echo "Supabase is awake — table '${HEALTH_TABLE}' responded OK."
