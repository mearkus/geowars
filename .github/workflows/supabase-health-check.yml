name: Supabase Health Check

# Pings the Supabase REST API with a tiny read-only query so the free-tier
# project registers activity and is not auto-paused after 7 idle days.

on:
  schedule:
    - cron: '0 9 * * 1,4'   # Mondays and Thursdays at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-health-check
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Publicly readable table (the leaderboard); override with a repo variable if needed
      HEALTH_TABLE: ${{ vars.SUPABASE_HEALTH_TABLE || 'scores' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: index.html
          sparse-checkout-cone-mode: false

      - name: Resolve Supabase credentials
        env:
          # Optional: when unset, the public values in index.html are used instead
          SECRET_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          SUPABASE_URL="$SECRET_URL"
          SUPABASE_ANON_KEY="$SECRET_ANON_KEY"
          if [ -z "$SUPABASE_URL" ]; then
            SUPABASE_URL=$(sed -nE "s/^const SUPABASE_URL *= *'([^']+)'.*/\1/p" index.html)
            echo "SUPABASE_URL secret not set; using value from index.html"
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            SUPABASE_ANON_KEY=$(sed -nE "s/^const SUPABASE_ANON *= *'([^']+)'.*/\1/p" index.html)
            echo "SUPABASE_ANON_KEY secret not set; using value from index.html"
          fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::No Supabase URL/key found in secrets or index.html."
            exit 1
          fi
          echo "::add-mask::$SUPABASE_ANON_KEY"
          echo "SUPABASE_URL=$SUPABASE_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> "$GITHUB_ENV"

      - name: Ping Supabase
        run: |
          set -euo pipefail
          url="${SUPABASE_URL%/}/rest/v1/${HEALTH_TABLE}?select=*&limit=1"

          status=$(curl --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 30 \
            --output response.json --write-out '%{http_code}' \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --header "Accept: application/json" \
            "$url")

          echo "HTTP status: $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Supabase health check failed (HTTP $status)"
            cat response.json || true
            exit 1
          fi
          echo "Supabase is awake — table '${HEALTH_TABLE}' responded OK."
